server {
    server_name stream.democracyinnovators.com;

    client_max_body_size 32m;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:8098;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/stream.democracyinnovators.com.access.log;
    error_log /var/log/nginx/stream.democracyinnovators.com.error.log;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/stream.democracyinnovators.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stream.democracyinnovators.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name stream.democracyinnovators.com;
    return 301 https://$host$request_uri;
}
