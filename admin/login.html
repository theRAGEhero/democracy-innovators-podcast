<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Democracy Innovators</title>
    <link rel="stylesheet" href="/css/styles.css?v=20260415-rainbow-1" />
    <link rel="stylesheet" href="/css/admin.css?v=20260411-2" />
  </head>
  <body>
    <main class="admin-shell">
      <section class="admin-card">
        <h1>Admin Login</h1>
        <p class="admin-muted">Restricted access for content management.</p>

        <form id="login-form" class="admin-form" novalidate>
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required />

          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />

          <button type="submit">Sign in</button>
          <p id="status" class="admin-status" role="status"></p>
        </form>
      </section>
    </main>

    <script src="/js/admin-login.js?v=20260411-2" type="module"></script>
  </body>
</html>
